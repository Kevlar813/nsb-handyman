<script>
  // How long (ms) to wait after your last words before sending a spoken question.
  // A pause shorter than this joins the next phrase onto the same question.
  const FINISH_MS = 900;
  // An answer citing this many notes or more lights the whole cluster instead of flying to one note.
  const CLUSTER_MIN = 4;
  // Spoken answers stop after this many sentences; the full answer and the note stay on screen.
  const SPOKEN_MAX_SENTENCES = 2;
  // Screen frames: Claude reads up to 2576 px on the long edge / ~3.75 MP at full detail.
  const MAX_FRAME_EDGE = 2576;
  const MAX_FRAME_PIXELS = 3750000;
  const FRAME_JPEG_QUALITY = 0.85;
</script>

<style>
  :root {
    --bg: #000;
    --panel: rgba(10, 14, 28, 0.78);
    --panel-border: rgba(140, 170, 255, 0.18);
    --text: #e8ecff;
    --muted: #8f9bc4;
    --accent: #7aa2ff;
    --warn: #ffb86b;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text);
    font-family: Inter, system-ui, -apple-system, Segoe UI, sans-serif; overflow: hidden; }
  #graph { position: fixed; inset: 0; }
  .glass { background: var(--panel); border: 1px solid var(--panel-border);
    backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px); border-radius: 14px; }

  #hud { position: fixed; top: 16px; left: 16px; padding: 14px 16px; max-width: 280px; z-index: 5; }
  #hud h1 { margin: 0 0 2px; font-size: 15px; font-weight: 600; letter-spacing: .08em; text-transform: uppercase; }
  #hud .sub { color: var(--muted); font-size: 12px; margin-bottom: 10px; }
  #legend { display: flex; flex-wrap: wrap; gap: 6px; }
  .chip { display: inline-flex; align-items: center; gap: 6px; font-size: 12px; padding: 3px 9px;
    border-radius: 999px; background: rgba(255,255,255,.06); border: 1px solid rgba(255,255,255,.08);
    color: var(--text); cursor: pointer; user-select: none; }
  .chip:hover { background: rgba(255,255,255,.12); }
  .dot { width: 8px; height: 8px; border-radius: 50%; box-shadow: 0 0 8px currentColor; background: currentColor; }

  #panel { position: fixed; top: 16px; right: 16px; width: 360px; max-height: calc(100% - 150px);
    padding: 20px; overflow-y: auto; transform: translateX(calc(100% + 24px)); transition: transform .45s cubic-bezier(.2,.8,.2,1); z-index: 5; }
  #panel.open { transform: none; }
  .source-badge { display: inline-block; margin-left: 6px; font-size: 11px; font-weight: 600; letter-spacing: .06em;
    text-transform: uppercase; padding: 3px 9px; border-radius: 999px; color: #061033; background: var(--accent);
    box-shadow: 0 0 14px rgba(122,162,255,.6); vertical-align: middle; }
  #panel h2 { margin: 6px 0 12px; font-size: 20px; font-weight: 600; line-height: 1.25; padding-right: 24px; }
  #panel .excerpt { font-size: 14px; line-height: 1.6; color: #cdd5f5; white-space: pre-wrap; }
  #panel .path { color: var(--muted); font-size: 11px; margin-top: 12px; word-break: break-all; }
  #panel h3 { font-size: 11px; text-transform: uppercase; letter-spacing: .1em; color: var(--muted); margin: 18px 0 8px; }
  #neighbours { display: flex; flex-wrap: wrap; gap: 6px; }
  .close { position: absolute; top: 12px; right: 12px; background: none; border: 0; color: var(--muted);
    font-size: 22px; cursor: pointer; line-height: 1; }
  .close:hover { color: var(--text); }

  #chat { position: fixed; left: 50%; bottom: 20px; transform: translateX(-50%); width: min(760px, calc(100% - 32px)); z-index: 6; }
  #answer { margin-bottom: 10px; padding: 16px 18px; display: none; max-height: 40vh; overflow-y: auto; }
  #answer.show { display: block; animation: rise .35s ease-out; }
  #answer .q { color: var(--muted); font-size: 12px; margin-bottom: 6px; }
  #answer .q:empty { display: none; }
  #answer .a { font-size: 15px; line-height: 1.6; }
  #answer.error .a { color: var(--warn); }
  #answer .sources { margin-top: 10px; display: flex; flex-wrap: wrap; gap: 6px; }
  #bar { display: flex; align-items: center; gap: 8px; padding: 8px 8px 8px 18px; border-radius: 999px; }
  #q { flex: 1; background: transparent; border: 0; outline: 0; color: var(--text); font: inherit; font-size: 15px; padding: 8px 0; min-width: 0; }
  #q::placeholder { color: var(--muted); }
  .btn { border: 0; border-radius: 999px; padding: 9px 16px; font: inherit; font-size: 14px; font-weight: 500; cursor: pointer; }
  #send { background: var(--accent); color: #061033; }
  #send:disabled { opacity: .5; cursor: default; }
  #reset { background: rgba(255,255,255,.08); color: var(--muted); }
  #reset:hover { color: var(--text); }
  .icon-btn { width: 38px; height: 38px; flex: none; display: grid; place-items: center; border: 0; border-radius: 50%;
    background: rgba(255,255,255,.08); color: var(--muted); cursor: pointer; position: relative; }
  .icon-btn:hover { color: var(--text); }
  .icon-btn svg { width: 18px; height: 18px; }
  .icon-btn:disabled { opacity: .35; cursor: not-allowed; }
  #mic.on { background: rgba(92, 242, 181, .18); color: #5cf2b5; }
  #mic.on::after { content: ''; position: absolute; inset: -4px; border-radius: 50%; border: 2px solid #5cf2b5; animation: ring 1.6s ease-out infinite; }
  #mute.muted { color: var(--warn); }
  @keyframes ring { from { opacity: .8; transform: scale(.9); } to { opacity: 0; transform: scale(1.35); } }

  #status { display: flex; align-items: center; gap: 8px; margin: 0 0 8px 14px; font-size: 12px; color: var(--muted); min-height: 18px; user-select: none; }
  #status .led { width: 8px; height: 8px; border-radius: 50%; background: #56607f; flex: none; transition: background .2s, box-shadow .2s; }
  #status[data-state="listening"] .led, #status[data-state="hearing"] .led { background: #5cf2b5; box-shadow: 0 0 10px #5cf2b5; }
  #status[data-state="hearing"] .led { animation: blink .5s ease-in-out infinite alternate; }
  #status[data-state="thinking"] .led { background: #ffd166; box-shadow: 0 0 10px #ffd166; animation: blink .7s ease-in-out infinite alternate; }
  #status[data-state="speaking"] .led { background: var(--accent); box-shadow: 0 0 12px var(--accent); animation: blink .35s ease-in-out infinite alternate; }
  #status[data-state="speaking"] { color: var(--text); cursor: pointer; }
  #status[data-state="warn"] { color: var(--warn); }
  #status[data-state="warn"] .led { background: var(--warn); }
  #status .heard { color: var(--text); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; min-width: 0; }
  #finish { height: 2px; width: 0; background: #5cf2b5; border-radius: 2px; margin: -4px 22px 6px; opacity: 0; transition: opacity .2s; }
  #finish.run { opacity: .9; }
  @keyframes blink { from { opacity: 1; } to { opacity: .35; } }

  /* Sight: impossible to miss while a screen share is live. */
  #eye-frame { position: fixed; inset: 0; pointer-events: none; z-index: 20; display: none;
    box-shadow: inset 0 0 0 4px #ff3b4e, inset 0 0 40px rgba(255, 59, 78, .45); animation: eyeglow 2s ease-in-out infinite alternate; }
  #eye-banner { position: fixed; top: 14px; left: 50%; transform: translateX(-50%); z-index: 21; display: none;
    align-items: center; gap: 12px; padding: 8px 8px 8px 16px; border-radius: 999px; background: #c8102e; color: #fff;
    font-size: 13px; font-weight: 600; letter-spacing: .04em; box-shadow: 0 0 24px rgba(255, 59, 78, .7); white-space: nowrap; }
  #eye-banner .rec { width: 10px; height: 10px; border-radius: 50%; background: #fff; animation: blink .8s ease-in-out infinite alternate; }
  #eye-banner button { border: 0; border-radius: 999px; padding: 6px 12px; font: inherit; font-size: 12px; cursor: pointer;
    background: #fff; color: #c8102e; font-weight: 700; }
  body.seeing #eye-frame { display: block; }
  body.seeing #eye-banner { display: flex; }
  #screen.on { background: #c8102e; color: #fff; }
  @keyframes eyeglow { from { opacity: .75; } to { opacity: 1; } }
  #eye-video { position: fixed; width: 2px; height: 2px; opacity: 0; pointer-events: none; left: 0; top: 0; }
  #a-frame { display: none; margin-top: 10px; align-items: center; gap: 10px; font-size: 11px; color: var(--muted); }
  #a-frame.show { display: flex; }
  #a-frame img { max-height: 72px; max-width: 128px; border-radius: 6px; border: 1px solid #ff3b4e; }
  .thinking { display: inline-block; width: 1em; text-align: left; }
  .thinking::after { content: '…'; animation: dots 1.2s steps(4) infinite; overflow: hidden; display: inline-block; vertical-align: bottom; width: 0; }
  @keyframes dots { to { width: 1.2em; } }
  @keyframes rise { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }

  #loading { position: fixed; inset: 0; display: grid; place-items: center; color: var(--muted); font-size: 13px; letter-spacing: .2em; text-transform: uppercase; z-index: 10; pointer-events: none; transition: opacity .8s; }
  .scene-tooltip { font-family: Inter, system-ui, sans-serif !important; font-size: 13px !important;
    background: rgba(10,14,28,.85) !important; padding: 4px 10px !important; border-radius: 8px !important; border: 1px solid var(--panel-border); }

  @media (max-width: 720px) {
    #hud { max-width: calc(100% - 32px); right: 16px; }
    #legend { display: none; }
    #panel { left: 16px; right: 16px; width: auto; top: auto; bottom: 90px; max-height: 45vh; transform: translateY(calc(100% + 120px)); }
    #panel.open { transform: none; }
    #reset { display: none; }
    #eye-banner { left: 8px; right: 8px; transform: none; justify-content: space-between; white-space: normal; }
  }
</style>

<body>
<div id="graph"></div>
<div id="eye-frame" aria-hidden="true"></div>
<div id="eye-banner" role="alert"><span class="rec"></span><span>SCREEN SHARED · I can see your screen</span><button type="button" id="eye-stop">Stop sharing</button></div>
<video id="eye-video" muted playsinline></video>
<div id="loading">Assembling galaxy</div>

<div id="hud" class="glass">
  <h1>Knowledge Galaxy</h1>
  <div class="sub" id="stats"></div>
  <div id="legend"></div>
</div>

<aside id="panel" class="glass" aria-live="polite">
  <button class="close" id="close" aria-label="Close">×</button>
  <span class="chip" id="p-group"><span class="dot"></span><span></span></span>

<div id="chat">
  <div id="answer" class="glass">
    <div class="q" id="a-q"></div>
    <div class="a" id="a-text"></div>
    <div class="sources" id="a-sources"></div>
    <div id="a-frame"><img alt="The exact screen frame that was sent"><span></span></div>
  </div>
  <div id="status" data-state="idle" role="status" aria-live="polite"><span class="led"></span><span class="label">Ready</span><span class="heard"></span></div>
  <div id="finish"></div>
  <form id="bar" class="glass">
    <input id="q" autocomplete="off" placeholder="Ask your notes anything…" aria-label="Ask a question">
    <button type="button" class="icon-btn" id="mute" title="Mute spoken answers" aria-label="Mute spoken answers" aria-pressed="false">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M11 5 6 9H2v6h4l5 4V5z"/><path class="wave" d="M15.5 8.5a5 5 0 0 1 0 7M18.5 5.5a9 9 0 0 1 0 13"/><path class="cross" d="m16 9 6 6m0-6-6 6" style="display:none"/></svg>
    </button>

    </button>

<script type="module">
import * as THREE from 'three';
import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';

const PALETTE = ['#5ab0ff', '#ff6bcb', '#ffd166', '#5cf2b5', '#b28dff', '#ff8a5c', '#62e3ff', '#f5f19c', '#ff5c7a', '#9cff6b'];
const { nodes, links } = GRAPH;
const groups = [...new Set(nodes.map(n => n.group))].sort();
const groupColor = Object.fromEntries(groups.map((g, i) => [g, PALETTE[i % PALETTE.length]]));

// Adjacency, by node index (node.id === index in GRAPH.nodes).
const neighbours = nodes.map(() => new Set());
links.forEach(l => { neighbours[l.source].add(l.target); neighbours[l.target].add(l.source); });

// ---------- glow sprite texture ----------
const glowTexture = (() => {
  const c = document.createElement('canvas'); c.width = c.height = 128;
  const g = c.getContext('2d');
  const grd = g.createRadialGradient(64, 64, 0, 64, 64, 64);
  grd.addColorStop(0, 'rgba(255,255,255,1)');
  grd.addColorStop(0.15, 'rgba(255,255,255,0.85)');
  grd.addColorStop(0.4, 'rgba(255,255,255,0.25)');
  grd.addColorStop(1, 'rgba(255,255,255,0)');
  g.fillStyle = grd; g.fillRect(0, 0, 128, 128);
  const t = new THREE.CanvasTexture(c); t.colorSpace = THREE.SRGBColorSpace; return t;
})();
const coreGeometry = new THREE.SphereGeometry(1, 24, 24);

function nodeSize(n) { return 2.2 + Math.sqrt(n.degree || 0) * 1.1; }

function makeNodeObject(n) {
  const color = new THREE.Color(groupColor[n.group]);
  const group = new THREE.Group();
  const core = new THREE.Mesh(coreGeometry, new THREE.MeshBasicMaterial({ color: color.clone().lerp(new THREE.Color('#ffffff'), 0.12), transparent: true }));
  const s = nodeSize(n);
  core.scale.setScalar(s);
  const glow = new THREE.Sprite(new THREE.SpriteMaterial({ map: glowTexture, color, transparent: true,
    blending: THREE.AdditiveBlending, depthWrite: false, opacity: 0.55 }));
  glow.scale.setScalar(s * 6);
  glow.raycast = () => {};   // only the core sphere is clickable
  group.add(glow, core);
  n.__core = core; n.__glow = glow; n.__baseSize = s;
  return group;
}

// ---------- graph ----------
const Graph = new ForceGraph3D(document.getElementById('graph'), { controlType: 'orbit' })
  .backgroundColor('#000000')
  .showNavInfo(false)
  .graphData({ nodes, links })
  .nodeId('id')
  .nodeLabel(n => `${n.label}`)
  .nodeThreeObject(makeNodeObject)
  .linkColor(l => linkStyle(l).color)
  .linkOpacity(0.35)
  .linkWidth(l => linkStyle(l).width)
  .linkDirectionalParticles(l => isHotLink(l) ? 3 : 0)
  .linkDirectionalParticleWidth(1.6)
  .linkDirectionalParticleSpeed(0.006)
  .enableNodeDrag(false)
  .onNodeClick(n => focusNode(n))
  .onBackgroundClick(() => clearFocus())
  .onNodeHover(n => { document.body.style.cursor = n ? 'pointer' : ''; })
  .warmupTicks(60)
  .cooldownTime(6000);

Graph.d3Force('charge').strength(-140);
Graph.d3Force('link').distance(l => 45 + 20 / (l.weight || 1));

// Bloom
const bloom = new UnrealBloomPass(new THREE.Vector2(innerWidth, innerHeight), 0.75, 0.5, 0.18);
Graph.postProcessingComposer().addPass(bloom);

// Starfield (two layers for depth)
const scene = Graph.scene();
function starLayer(count, rMin, rMax, size, opacity) {
  const pos = new Float32Array(count * 3), col = new Float32Array(count * 3);
  const tints = [new THREE.Color('#ffffff'), new THREE.Color('#cfe0ff'), new THREE.Color('#ffe9c4'), new THREE.Color('#bcd2ff')];
  for (let i = 0; i < count; i++) {
    const v = new THREE.Vector3().randomDirection().multiplyScalar(rMin + Math.random() * (rMax - rMin));
    pos.set([v.x, v.y, v.z], i * 3);
    const c = tints[(Math.random() * tints.length) | 0].clone().multiplyScalar(0.5 + Math.random() * 0.5);
    col.set([c.r, c.g, c.b], i * 3);
  }
  const geo = new THREE.BufferGeometry();
  geo.setAttribute('position', new THREE.BufferAttribute(pos, 3));
  geo.setAttribute('color', new THREE.BufferAttribute(col, 3));
  const pts = new THREE.Points(geo, new THREE.PointsMaterial({ size, vertexColors: true, transparent: true,
    opacity, depthWrite: false, sizeAttenuation: true }));
  scene.add(pts);
  return pts;
}
const stars = [starLayer(3500, 1400, 2600, 2.6, 0.9), starLayer(900, 900, 1300, 3.6, 0.75)];

// Idle rotation via OrbitControls
const controls = Graph.controls();
controls.autoRotate = true;
controls.autoRotateSpeed = 0.35;
controls.enableDamping = true;
controls.dampingFactor = 0.08;
let idleTimer = null;
function pauseRotation(ms = 9000) {
  controls.autoRotate = false;
  clearTimeout(idleTimer);
  idleTimer = setTimeout(() => { controls.autoRotate = true; }, ms);
}
controls.addEventListener('start', () => pauseRotation());

Graph.cameraPosition({ x: 0, y: 60, z: 420 });

// Subtle star drift + pulse on highlighted nodes
let t0 = performance.now();
(function animate() {
  const t = (performance.now() - t0) / 1000;
  stars[0].rotation.y = t * 0.004; stars[1].rotation.y = -t * 0.006;
  for (const n of nodes) {
    if (!n.__glow) continue;
    const hot = answerSet.has(n.id) || n.id === focusId;
    const target = n.__baseSize * 6 * (hot ? 1.35 + 0.18 * Math.sin(t * 3 + n.id) : 1);
    n.__glow.scale.setScalar(n.__glow.scale.x + (target - n.__glow.scale.x) * 0.12);
  }
  requestAnimationFrame(animate);
})();

addEventListener('resize', () => bloom.setSize(innerWidth, innerHeight));

// ---------- highlight state ----------
let focusId = null;          // clicked node
let lit = new Set();         // focus + neighbours, or answer nodes
let answerSet = new Set();   // nodes cited by the brain

function isHotLink(l) {
  const s = typeof l.source === 'object' ? l.source.id : l.source;
  const t = typeof l.target === 'object' ? l.target.id : l.target;
  if (focusId !== null) return s === focusId || t === focusId;
  if (answerSet.size) return answerSet.has(s) && answerSet.has(t);
  return false;
}
function linkStyle(l) {
  if (isHotLink(l)) {
    const src = typeof l.source === 'object' ? l.source : nodes[l.source];
    return { color: groupColor[src.group], width: 0.7 };
  }
  return { color: lit.size ? 'rgba(90,110,170,0.25)' : 'rgba(140,165,255,0.55)', width: 0.4 };
}
function applyHighlight() {
  for (const n of nodes) {
    if (!n.__core) continue;
    const on = !lit.size || lit.has(n.id);
    n.__core.material.opacity = on ? 1 : 0.18;
    n.__glow.material.opacity = on ? 0.6 : 0.08;
  }
  Graph.linkColor(Graph.linkColor()).linkWidth(Graph.linkWidth()).linkDirectionalParticles(Graph.linkDirectionalParticles());
}

// ---------- side panel ----------
const panel = document.getElementById('panel');
function chip(n) {
  const el = document.createElement('span');
  el.className = 'chip';
  el.style.color = groupColor[n.group];
  const dot = document.createElement('span'); dot.className = 'dot';
  const lab = document.createElement('span'); lab.textContent = n.label; lab.style.color = 'var(--text)';
  el.append(dot, lab);
  el.addEventListener('click', () => focusNode(n));
  return el;
}
function openPanel(n, asSource = false) {
  document.getElementById('p-source').hidden = !asSource;
  const g = document.getElementById('p-group');
  g.style.color = groupColor[n.group];
  g.lastElementChild.textContent = n.group; g.lastElementChild.style.color = 'var(--text)';
  document.getElementById('p-title').textContent = n.label;
  document.getElementById('p-excerpt').textContent = n.excerpt;
  document.getElementById('p-path').textContent = n.path;
  const box = document.getElementById('neighbours'); box.replaceChildren();
  [...neighbours[n.id]].map(i => nodes[i]).sort((a, b) => a.label.localeCompare(b.label)).forEach(m => box.append(chip(m)));
  if (!neighbours[n.id].size) box.textContent = 'No links yet.';
  panel.classList.add('open');
}
document.getElementById('close').addEventListener('click', clearFocus);
addEventListener('keydown', e => { if (e.key === 'Escape') clearFocus(); });

function flyTo(n, ms = 1600) {
  const dist = 150;
  const r = Math.hypot(n.x, n.y, n.z) || 1;
  const ratio = 1 + dist / r;
  pauseRotation(ms + 6000);
  Graph.cameraPosition({ x: n.x * ratio, y: n.y * ratio + 12, z: n.z * ratio }, { x: n.x, y: n.y, z: n.z }, ms);
}
function focusNode(n) {
  focusId = n.id;
  lit = new Set([n.id, ...neighbours[n.id]]);
  applyHighlight();
  openPanel(n);
  flyTo(n);
}
function clearFocus() {
  focusId = null;
  lit = new Set(answerSet);
  panel.classList.remove('open');
  applyHighlight();
}

// ---------- HUD ----------
document.getElementById('stats').textContent = `${nodes.length} notes · ${links.length} connections`;
const legend = document.getElementById('legend');
groups.forEach(g => {
  const count = nodes.filter(n => n.group === g).length;
  const el = document.createElement('span'); el.className = 'chip'; el.style.color = groupColor[g];
  const dot = document.createElement('span'); dot.className = 'dot';
  const lab = document.createElement('span'); lab.textContent = `${g} ${count}`; lab.style.color = 'var(--text)';
  el.append(dot, lab);
  el.title = `Highlight ${g}`;
  el.addEventListener('click', () => {
    focusId = null; panel.classList.remove('open');
    const ids = nodes.filter(n => n.group === g).map(n => n.id);
    lit = new Set(ids); applyHighlight();
    pauseRotation();
    Graph.zoomToFit(1400, 80, n => lit.has(n.id));
  });
  legend.append(el);
});

// ---------- chat ----------
const newSession = () => (crypto.randomUUID ? crypto.randomUUID() : String(Math.random()).slice(2)).replace(/-/g, '');
let session = newSession();
const form = document.getElementById('bar'), input = document.getElementById('q'), send = document.getElementById('send');
const answerBox = document.getElementById('answer');
let thinking = false, askCtl = null, askSeq = 0;

function showAnswer(q, text, ids, isError) {
  document.getElementById('a-q').textContent = q;
  const a = document.getElementById('a-text');
  if (text === null) { a.replaceChildren(document.createTextNode('Thinking'), Object.assign(document.createElement('span'), { className: 'thinking' })); }
  else a.textContent = text;
  answerBox.classList.toggle('error', !!isError);
  const src = document.getElementById('a-sources'); src.replaceChildren();
  (ids || []).forEach(i => nodes[i] && src.append(chip(nodes[i])));
  showFrameUsed(null);
  answerBox.classList.add('show');
}

// One path for typed and spoken questions.
async function ask(q) {
  q = q.trim();
  if (!q) return;
  const askedAt = Date.now();
  stopSpeaking();
  if (askCtl) askCtl.abort();
  const ctl = askCtl = new AbortController(), seq = ++askSeq;
  // While a share is live, every question is about the screen. Otherwise a question that is
  // plainly about the screen gets told there is nothing to see; it never goes to the notes.
  const viaScreen = shareLive();
  if (!viaScreen && looksLikeScreenQuestion(q)) {
    askCtl = null;
    const msg = eye.endedAt ? SHARE_ENDED_LINE : 'I can\u2019t see your screen at the moment. Click the screen button to share it, then ask again.';
    showAnswer(q, msg, [], true); speak(msg); return;
  }
  thinking = viaScreen ? 'screen' : true; send.disabled = true; renderStatus();
  showAnswer(q, null, []);
  try {
    let shot = null, body = { question: q, session };
    if (viaScreen) {
      shot = await captureFrame(askedAt);   // a brand-new frame, taken now, never a stored one
      if (seq !== askSeq) return;
      body.frame = shot.frame;
    }
    const res = await fetch(viaScreen ? '/see' : '/chat', { method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(body), signal: ctl.signal });
    const data = await res.json();
    if (seq !== askSeq) return;
    if (data.session) session = data.session;
    // Note numbers only mean something against the graph version they came from. If the notes were
    // re-indexed since this page loaded (e.g. by /remember), don't point at the wrong stars.
    const stale = !!(data.graph_version && GRAPH.version && data.graph_version !== GRAPH.version);
    const ids = stale ? [] : (data.nodes || []).filter(i => Number.isInteger(i) && nodes[i]);
    const answer = data.answer || 'No answer returned.';
    showAnswer(q, answer, ids, !!data.error);
    if (shot) showFrameUsed(shot, data.frame_used);
    proveAnswer(!stale && data.about_notes === true, ids);
    if (stale) flashStatus('Your notes changed since this page loaded \u2014 reload to see them in the galaxy', 'warn', 8000);
    thinking = false;
    speak(spokenVersion(answer));
  } catch (err) {
    if (err.name === 'AbortError' || seq !== askSeq) return;
    const msg = err.name === 'ShareEnded' ? SHARE_ENDED_LINE
      : err.name === 'FrameError' ? `I couldn\u2019t capture your screen: ${err.message}`
      : `Could not reach the server: ${err.message}`;   // graph holds still on errors
    showAnswer(q, msg, [], true);
    thinking = false;
    speak(msg);
  } finally {
    if (seq === askSeq) { thinking = false; askCtl = null; send.disabled = false; renderStatus(); if (!ear.on) input.focus(); }
  }
}

// Show where an answer came from. The order of the checks is the point:
//   1. Was the message about the notes at all? Small talk ("good morning", a joke) leaves the
//      graph exactly as it was: no camera move, no highlight change, panel untouched.
//   2. Only then look at how many notes it used:
//      1..CLUSTER_MIN-1 notes -> fly to the top source, light it and its neighbours, open its panel.
//      CLUSTER_MIN or more    -> no flight (one node of six would misrepresent the answer);
//                                light the whole cited cluster where it sits.
//      none                   -> a notes question the notes don't cover: clear stale highlights so
//                                nothing on screen falsely claims to be a source; camera stays.
function proveAnswer(aboutNotes, ids) {
  if (!aboutNotes) return;
  if (!ids.length) { answerSet = new Set(); clearFocus(); return; }
  answerSet = new Set(ids);
  if (ids.length >= CLUSTER_MIN) {
    focusId = null;
    panel.classList.remove('open');
    lit = new Set(ids);
    applyHighlight();
    return;
  }
  const top = nodes[ids[0]];
  focusId = top.id;
  lit = new Set([top.id, ...neighbours[top.id], ...ids]);
  applyHighlight();
  openPanel(top, true);
  flyTo(top);
}

// What gets spoken: the answer only (never the note), cut to SPOKEN_MAX_SENTENCES.
function spokenVersion(answer) {
  const clean = answer.replace(/\[\d+(?:,\s*\d+)*\]/g, '').replace(/[*_#`>]/g, '').replace(/\s+/g, ' ').trim();
  return sentencesOf(clean).slice(0, SPOKEN_MAX_SENTENCES).join(' ');
}

// Sentence boundaries are punctuation followed by a space, so "$3.50" or "1.5 hours" stay whole.
function sentencesOf(text) {
  return text.replace(/\s+/g, ' ').trim().split(/(?<=[.!?]["')\]]?)\s+/).filter(Boolean);
}

function cancelAsk() {
  if (!askCtl) return;
  askCtl.abort(); askCtl = null; askSeq++;
  thinking = false; send.disabled = false;
  document.getElementById('a-text').textContent = 'Stopped.';
}

form.addEventListener('submit', e => {
  e.preventDefault();
  const q = input.value;
  input.value = '';
  clearHeard();
  ask(q);
});

document.getElementById('reset').addEventListener('click', async () => {
  stopSpeaking(); cancelAsk(); clearHeard();
  try { await fetch('/chat/reset', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ session }) }); } catch {}
  session = newSession();
  answerSet = new Set(); answerBox.classList.remove('show'); clearFocus();
  Graph.zoomToFit(1400, 60);
  renderStatus();
});

// ---------- status line ----------
const statusEl = document.getElementById('status');
const finishBar = document.getElementById('finish');
let flash = null;   // brief one-off message, e.g. "Stopped"

function renderStatus() {
  let state, label;
  const heard = ear.on ? [...ear.buffer, ear.interim].filter(Boolean).join(' ') : '';
  if (flash && performance.now() < flash.until) { state = flash.state; label = flash.text; }
  else if (voice.speaking) { state = 'speaking'; label = ear.on ? 'Speaking — say “stop” or click here to interrupt' : 'Speaking — click here or press Esc to stop'; }
  else if (thinking) { state = 'thinking'; label = thinking === 'screen' ? 'Looking at your screen…' : 'Thinking…'; }
  else if (ear.on && ear.interim) { state = 'hearing'; label = 'Listening — hearing you:'; }
  else if (ear.on && ear.buffer.length) { state = 'hearing'; label = 'Listening — got it, waiting in case you’re not done:'; }
  else if (ear.on) { state = 'listening'; label = 'Listening — your turn'; }
  else if (ear.blocked) { state = 'warn'; label = ear.blocked; }
  else {
    state = 'idle';
    label = Recognition ? 'Ready — type, or click the mic to talk' : 'Ready — type a question (voice input needs Chrome, Edge or Safari)';
    if (synth && !voice.unlocked && !voice.muted) label += ' · voice switches on at your first click';
  }
  statusEl.dataset.state = state;
  statusEl.querySelector('.label').textContent = label;
  statusEl.querySelector('.heard').textContent = (state === 'hearing') ? heard : '';
}
function flashStatus(text, state = 'listening', ms = 1400) {
  flash = { text, state, until: performance.now() + ms };
  renderStatus();
  setTimeout(renderStatus, ms + 20);
}
statusEl.addEventListener('click', () => { if (voice.speaking) { stopSpeaking(); flashStatus('Stopped', ear.on ? 'listening' : 'idle'); } });

// ---------- voice out: speechSynthesis ----------
const synth = window.speechSynthesis || null;
const voice = { unlocked: false, muted: false, chosen: null, pending: null, speaking: false, gen: 0,
                utterances: [], current: '', recent: '', recentUntil: 0 };
try { voice.muted = localStorage.getItem('galaxy.muted') === '1'; } catch {}

function pickVoice() {
  const all = synth ? synth.getVoices() : [];
  if (!all.length) return null;
  const score = v => {
    const lang = (v.lang || '').toLowerCase().replace('_', '-');
    let s = lang === 'en-gb' ? 100 : lang.startsWith('en') ? 10 : 0;
    if (/natural|neural|online|premium|enhanced/i.test(v.name)) s += 8;
    if (/google uk english|sonia|libby|ryan|maisie|thomas|daniel|serena|kate|arthur|martha/i.test(v.name)) s += 5;
    return s;
  };
  return [...all].sort((a, b) => score(b) - score(a))[0];
}
if (synth) {
  voice.chosen = pickVoice();
  const onVoices = () => { voice.chosen = pickVoice(); };
  if (synth.addEventListener) synth.addEventListener('voiceschanged', onVoices); else synth.onvoiceschanged = onVoices;
}

function splitSentences(text) {
  const out = [];
  for (const p of sentencesOf(text)) {
    if (out.length && out[out.length - 1].length < 40) out[out.length - 1] += ' ' + p; else out.push(p);
  }
  return out;
}

function speak(text) {
  if (!synth || voice.muted || !text) return;
  if (!voice.unlocked) { voice.pending = text; renderStatus(); return; }   // played on the first click
  stopSpeaking();
  const gen = voice.gen, chunks = splitSentences(text);
  let started = false;
  voice.speaking = true;
  // Keep references: Chrome can garbage-collect utterances mid-speech and never fire onend.
  voice.utterances = chunks.map((chunk, i) => {
    const u = new SpeechSynthesisUtterance(chunk);
    if (voice.chosen) { u.voice = voice.chosen; u.lang = voice.chosen.lang; } else u.lang = 'en-GB';
    u.onstart = () => { if (gen !== voice.gen) return; started = true; voice.current = chunk; renderStatus(); };
    u.onend = () => {
      if (gen !== voice.gen) return;
      rememberSpoken(chunk);
      if (i === chunks.length - 1) { voice.speaking = false; voice.current = ''; renderStatus(); }
    };
    u.onerror = e => {
      if (gen !== voice.gen) return;
      voice.speaking = false; voice.current = '';
      if (e.error === 'not-allowed') { voice.unlocked = false; voice.pending = text; }   // retry on next click
      renderStatus();
    };
    return u;
  });
  voice.utterances.forEach(u => synth.speak(u));
  renderStatus();
  // If the engine never starts (no voices installed), don't leave the status stuck on "speaking".
  setTimeout(() => { if (gen === voice.gen && !started && !synth.speaking && !synth.pending) { voice.speaking = false; renderStatus(); } }, 4000);
}

function stopSpeaking() {
  voice.gen++;
  if (synth && (voice.speaking || synth.speaking || synth.pending)) synth.cancel();
  if (voice.current) rememberSpoken(voice.current);
  voice.speaking = false; voice.current = ''; voice.utterances = [];
  renderStatus();
}

function rememberSpoken(chunk) {
  voice.recent = (voice.recent + ' ' + chunk).slice(-600);
  voice.recentUntil = performance.now() + 2500;
}

// Browsers refuse speech until the page has had a user gesture, so the first line is spoken
// synchronously inside the first click or key press — never before it.
function unlockVoice() {
  if (voice.unlocked || !synth) return;
  voice.unlocked = true;
  const first = voice.pending;      // the boot greeting, or an answer that arrived before any click
  voice.pending = null;
  if (first) speak(first);
}
['pointerdown', 'keydown', 'touchend'].forEach(t => addEventListener(t, unlockVoice, { capture: true }));

const muteBtn = document.getElementById('mute');
function renderMute() {
  muteBtn.classList.toggle('muted', voice.muted);
  muteBtn.setAttribute('aria-pressed', String(voice.muted));
  muteBtn.title = voice.muted ? 'Unmute spoken answers' : 'Mute spoken answers';
  muteBtn.querySelector('.wave').style.display = voice.muted ? 'none' : '';
  muteBtn.querySelector('.cross').style.display = voice.muted ? '' : 'none';
}
if (!synth) { muteBtn.disabled = true; muteBtn.title = 'This browser cannot speak'; }
muteBtn.addEventListener('click', () => {
  voice.muted = !voice.muted;
  if (voice.muted) stopSpeaking();
  try { localStorage.setItem('galaxy.muted', voice.muted ? '1' : '0'); } catch {}
  renderMute(); renderStatus();
});
renderMute();
addEventListener('keydown', e => { if (e.key === 'Escape' && voice.speaking) stopSpeaking(); });

// ---------- voice in: SpeechRecognition ----------
const Recognition = window.SpeechRecognition || window.webkitSpeechRecognition || null;
const INTERRUPT_WORDS = ['stop', 'wait', 'cancel', 'hold on', 'pause', 'be quiet'];
const ear = { on: false, rec: null, buffer: [], interim: '', timer: null, handledFinal: -1,
              interruptFired: new Set(), blocked: '', restarts: [], ownsInput: false };
const micBtn = document.getElementById('mic');

const normalise = t => t.toLowerCase().replace(/[^\p{L}\p{N}\s']/gu, ' ').replace(/\s+/g, ' ').trim();
const wordsOf = t => normalise(t).split(' ').filter(Boolean);

function leadingInterrupt(text) {
  const n = normalise(text);
  return INTERRUPT_WORDS.find(w => n === w || n.startsWith(w + ' ')) || null;
}
function stripInterrupts(text) {
  let t = text.trim(), w;
  while ((w = leadingInterrupt(t))) {
    const re = new RegExp('^\\W*' + w.split(' ').join('\\W+') + '\\b\\W*', 'i');
    t = t.replace(re, '').trim();
  }
  return t;
}

// The machine's own voice can leak into the mic. Ignore phrases made of words it just said.
function spokenRecently() {
  return voice.current + ' ' + (voice.speaking || performance.now() < voice.recentUntil ? voice.recent : '');
}
function isEcho(text) {
  if (!voice.speaking && performance.now() >= voice.recentUntil) return false;
  const heard = wordsOf(text);
  if (!heard.length) return false;
  const said = new Set(wordsOf(spokenRecently()));
  return heard.filter(w => said.has(w)).length / heard.length >= 0.6;
}

function fireInterrupt(word) {
  // "stop" inside the sentence being spoken is probably our own voice, not you.
  if (voice.speaking && wordsOf(voice.current).join(' ').includes(word)) return false;
  stopSpeaking();
  cancelAsk();
  clearHeard();
  flashStatus(`“${word}” — stopped. Listening.`, 'listening');
  return true;
}

function clearHeard() {
  clearTimeout(ear.timer); ear.timer = null;
  ear.buffer = []; ear.interim = '';
  finishBar.classList.remove('run');
  if (ear.ownsInput) { input.value = ''; ear.ownsInput = false; }
}

function restartFinishTimer() {
  clearTimeout(ear.timer);
  ear.timer = setTimeout(onFinishTimer, FINISH_MS);
  finishBar.style.transition = 'none'; finishBar.style.width = 'calc(100% - 44px)';
  finishBar.classList.add('run');
  void finishBar.offsetWidth;
  finishBar.style.transition = `width ${FINISH_MS}ms linear, opacity .2s`; finishBar.style.width = '0';
}

function onFinishTimer() {
  ear.timer = null;
  if (ear.interim) return;            // you're mid-phrase; its final result restarts the timer
  const q = ear.buffer.join(' ').replace(/\s+/g, ' ').trim();
  clearHeard();
  if (q) ask(q);
}

// While you speak, the input box shows the running transcript (it never clobbers typing otherwise).
function showHeard() {
  const heard = [...ear.buffer, ear.interim].filter(Boolean).join(' ');
  if (heard) { input.value = heard; ear.ownsInput = true; }
  else if (ear.ownsInput) { input.value = ''; ear.ownsInput = false; }
  renderStatus();
}

function onFinal(text, index) {
  let t = text.trim();
  if (leadingInterrupt(t)) {
    if (!ear.interruptFired.has(index)) { ear.interruptFired.add(index); fireInterrupt(leadingInterrupt(t)); }
    t = stripInterrupts(t);          // "wait, what about the fence" keeps "what about the fence"
  }
  if (!t || isEcho(t)) return;
  if (voice.speaking) stopSpeaking(); // you talked over it: your turn
  ear.buffer.push(t);
  restartFinishTimer();
}

function onResult(e) {
  let interim = '';
  for (let i = e.resultIndex; i < e.results.length; i++) {
    const r = e.results[i], text = r[0].transcript;
    if (r.isFinal) {
      if (i > ear.handledFinal) { ear.handledFinal = i; onFinal(text, i); }
    } else {
      const w = leadingInterrupt(text);
      if (w && !ear.interruptFired.has(i)) { ear.interruptFired.add(i); fireInterrupt(w); }   // instant, no buffer
      interim += ' ' + (ear.interruptFired.has(i) ? stripInterrupts(text) : text);
    }
  }
  interim = interim.trim();
  ear.interim = interim && !isEcho(interim) ? interim : '';
  if (ear.interim && ear.buffer.length) restartFinishTimer();   // more speech arriving: hold the send
  showHeard();
}

function startRecognition() {
  const rec = new Recognition();
  rec.continuous = true;
  rec.interimResults = true;
  rec.maxAlternatives = 1;
  rec.lang = navigator.language || 'en-GB';
  rec.onresult = onResult;
  rec.onerror = e => {
    if (e.error === 'not-allowed' || e.error === 'service-not-allowed') {
      ear.blocked = 'Microphone blocked — allow it from the icon in the address bar, then click the mic again';
      setMic(false);
    } else if (e.error === 'audio-capture') {
      ear.blocked = 'No microphone found'; setMic(false);
    } else if (e.error === 'network') {
      ear.blocked = 'Speech recognition needs an internet connection'; setMic(false);
    }  // 'no-speech' and 'aborted' just end the session; onend restarts it
  };
  rec.onend = () => {
    if (ear.rec !== rec) return;
    // A phrase that never got a final result still counts.
    if (ear.interim) { ear.buffer.push(ear.interim); ear.interim = ''; restartFinishTimer(); }
    ear.handledFinal = -1; ear.interruptFired.clear();
    if (!ear.on) { ear.rec = null; renderStatus(); return; }
    const now = performance.now();
    ear.restarts = ear.restarts.filter(t => now - t < 10000).concat(now);
    if (ear.restarts.length > 6) { ear.blocked = 'Speech recognition keeps stopping — click the mic to try again'; setMic(false); return; }
    try { rec.start(); } catch { setTimeout(() => { if (ear.on && ear.rec === rec) try { rec.start(); } catch {} }, 250); }
  };
  ear.rec = rec;
  ear.handledFinal = -1; ear.interruptFired.clear();
  rec.start();
}

function setMic(on) {
  ear.on = on;
  micBtn.classList.toggle('on', on);
  micBtn.setAttribute('aria-pressed', String(on));
  micBtn.title = on ? 'Stop listening' : 'Speak a question';
  if (on) {
    ear.blocked = ''; ear.restarts = [];
    try { startRecognition(); } catch (err) { ear.blocked = `Could not start the microphone: ${err.message}`; setMic(false); return; }
  } else if (ear.rec) {
    try { ear.rec.stop(); } catch {}   // onend flushes anything you already said
  }
  renderStatus();
}

if (!Recognition) { micBtn.disabled = true; micBtn.title = 'Voice input needs Chrome, Edge or Safari'; }
micBtn.addEventListener('click', () => { if (Recognition) setMic(!ear.on); });
renderStatus();

// ---------- sight: screen share ----------
// The stream is held while you share; nothing else is. A frame is drawn onto a brand-new canvas
// only at the moment you ask, encoded as JPEG, checked to really be JPEG, and sent with the
// media type the browser actually produced. No frame is ever kept for a later question.
const SHARE_ENDED_LINE = 'The screen share has ended, so I can’t see your screen. Click the screen button to share it again.';
const eye = { stream: null, track: null, endedAt: 0, video: document.getElementById('eye-video'), thumbUrl: null };
const screenBtn = document.getElementById('screen');
const baseTitle = document.title;

const shareLive = () => !!(eye.track && eye.track.readyState === 'live' && eye.stream && eye.stream.active);
const looksLikeScreenQuestion = q => /\b(my|the|on|this) screen\b|\blooking at\b|\bcan you see\b|\bdo you see\b|\bwhat do you (think|make) of this\b|\bthis (page|window|tab|image|picture|photo|chart|graph|email|doc(ument)?|spreadsheet|code|slide|design|site|website|layout)\b/i.test(q);
const namedError = (name, message) => Object.assign(new Error(message), { name });

function renderEye() {
  const live = shareLive();
  document.body.classList.toggle('seeing', live);
  screenBtn.classList.toggle('on', live);
  screenBtn.setAttribute('aria-pressed', String(live));
  screenBtn.title = live ? 'Stop sharing your screen' : 'Share your screen so I can see it';
  document.title = live ? '● Sharing screen — ' + baseTitle : baseTitle;
}

async function startShare() {
  if (!navigator.mediaDevices || !navigator.mediaDevices.getDisplayMedia) {
    flashStatus('Screen sharing isn’t available in this browser', 'warn', 3500); return;
  }
  try {
    const stream = await navigator.mediaDevices.getDisplayMedia({ video: { frameRate: { ideal: 5, max: 15 } }, audio: false });
    const track = stream.getVideoTracks()[0];
    if (!track) { stream.getTracks().forEach(t => t.stop()); return; }
    eye.stream = stream; eye.track = track; eye.endedAt = 0;
    track.addEventListener('ended', () => shareEnded());       // "Stop sharing" in the browser's own bar
    stream.addEventListener('inactive', () => shareEnded());
    eye.video.srcObject = stream;
    await eye.video.play();
    renderEye();
    flashStatus('Screen shared — ask me about what you see', 'warn', 2500);
  } catch (err) {
    flashStatus(err.name === 'NotAllowedError' ? 'Screen share cancelled' : `Couldn’t start screen share: ${err.message}`, 'idle', 2500);
  }
}

function stopShare() {
  if (eye.stream) eye.stream.getTracks().forEach(t => t.stop());   // stop() fires no 'ended' event,
  shareEnded();                                                      // so announce it ourselves
}

function shareEnded() {
  if (!eye.stream) return;
  eye.stream = null; eye.track = null; eye.endedAt = Date.now();
  eye.video.pause(); eye.video.srcObject = null;
  renderEye();
  const line = 'The screen share has ended. I can no longer see your screen.';
  flashStatus(line, 'warn', 4000);
  // A question already past capture keeps going: its frame was taken while the share was live.
  if (thinking !== 'screen') speak(line);
}

async function captureFrame(askedAt) {
  if (!shareLive()) throw namedError('ShareEnded', 'share ended');
  const v = eye.video;
  // Wait for a frame the browser delivers after you asked. A static screen may not deliver one,
  // and then the track's current frame already is the live image; cap the wait at one second.
  if (v.requestVideoFrameCallback) {
    await new Promise(res => { const t = setTimeout(res, 1000); v.requestVideoFrameCallback(() => { clearTimeout(t); res(); }); });
  }
  if (!shareLive()) throw namedError('ShareEnded', 'share ended');
  const vw = v.videoWidth, vh = v.videoHeight;
  if (!vw || !vh) throw namedError('FrameError', 'the shared screen hasn’t produced an image yet');
  const scale = Math.min(1, MAX_FRAME_EDGE / Math.max(vw, vh), Math.sqrt(MAX_FRAME_PIXELS / (vw * vh)));
  const w = Math.round(vw * scale), h = Math.round(vh * scale);
  const canvas = document.createElement('canvas');                  // fresh every time
  canvas.width = w; canvas.height = h;
  canvas.getContext('2d').drawImage(v, 0, 0, w, h);
  const capturedAt = Date.now();
  let quality = FRAME_JPEG_QUALITY, blob;
  do {
    blob = await new Promise(r => canvas.toBlob(r, 'image/jpeg', quality));
    quality -= 0.15;
  } while (blob && blob.size > 4.5 * 1024 * 1024 && quality >= 0.4);
  // Browsers silently fall back to PNG for types they can't encode. Check what we actually got.
  if (!blob) throw namedError('FrameError', 'the browser could not encode the frame');
  const bytes = new Uint8Array(await blob.arrayBuffer());
  const isJpeg = bytes[0] === 0xFF && bytes[1] === 0xD8 && bytes[2] === 0xFF;
  if (blob.type !== 'image/jpeg' || !isJpeg) throw namedError('FrameError', `the browser produced ${blob.type || 'an unknown type'}, not JPEG`);
  let bin = '';
  for (let i = 0; i < bytes.length; i += 0x8000) bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
  return { blob, frame: { media_type: blob.type, data: btoa(bin), width: w, height: h, asked_at: askedAt, captured_at: capturedAt } };
}

// Under a screen answer, show the exact frame that was sent, so you can check what it saw.
function showFrameUsed(shot, info) {
  const box = document.getElementById('a-frame');
  if (eye.thumbUrl) { URL.revokeObjectURL(eye.thumbUrl); eye.thumbUrl = null; }
  if (!shot) { box.classList.remove('show'); return; }
  eye.thumbUrl = URL.createObjectURL(shot.blob);
  box.querySelector('img').src = eye.thumbUrl;
  const kb = Math.round(shot.blob.size / 1024);
  const after = ((shot.frame.captured_at - shot.frame.asked_at) / 1000).toFixed(1);
  box.querySelector('span').textContent = `Frame sent: ${shot.frame.width}×${shot.frame.height} JPEG, ${kb} KB, captured ${after}s after you asked.`;
  box.classList.add('show');
}

screenBtn.addEventListener('click', () => { shareLive() ? stopShare() : startShare(); });
document.getElementById('eye-stop').addEventListener('click', stopShare);
if (!navigator.mediaDevices || !navigator.mediaDevices.getDisplayMedia) { screenBtn.disabled = true; screenBtn.title = 'Screen sharing isn’t available in this browser'; }

// ---------- boot greeting ----------
// Wording comes from BOOT_GREETING in server.py's persona block. The count is read from the graph
// data and the time of day from this computer's clock. Shown at once; spoken at the first click,
// because browsers refuse audio before you have interacted with the page.
function timeOfDay(d = new Date()) {
  const h = d.getHours();
  return h >= 5 && h < 12 ? 'morning' : h >= 12 && h < 17 ? 'afternoon' : 'evening';
}
async function bootGreeting() {
  let template = 'Good {time_of_day}. {count} {notes} indexed.';
  try {
    const r = await fetch('/persona.json');
    if (r.ok) { const j = await r.json(); if (j.greeting) template = j.greeting; }
  } catch {}
  const count = GRAPH.nodes.length;
  const text = template.replace(/\{time_of_day\}/g, timeOfDay())
                       .replace(/\{count\}/g, count.toLocaleString('en-GB'))
                       .replace(/\{notes\}/g, count === 1 ? 'note' : 'notes');
  if (answerBox.classList.contains('show')) return;   // you already asked something
  showAnswer('', text, []);
  speak(text);
}
bootGreeting();

setTimeout(() => { const l = document.getElementById('loading'); l.style.opacity = 0; setTimeout(() => l.remove(), 900); }, 600);
window.__galaxy = { Graph, nodes, focusNode, voice, ear, eye };
</script>
