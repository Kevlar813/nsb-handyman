<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1000" width="1000" height="1000">
  <defs>
    <linearGradient id="spray" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#3FD8FF"/>
      <stop offset="1" stop-color="#0E9BD6"/>
    </linearGradient>
  </defs>
  <!-- badge -->
  <circle cx="500" cy="500" r="480" fill="#0A2342"/>
  <circle cx="500" cy="500" r="448" fill="none" stroke="#1EC8F0" stroke-width="14"/>
